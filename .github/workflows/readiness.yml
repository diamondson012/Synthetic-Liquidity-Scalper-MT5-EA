name: Source readiness
on: [push, pull_request]
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run readiness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-and-mt5-sources
          path: artifacts/
